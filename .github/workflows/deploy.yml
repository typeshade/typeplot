name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare
      url: https://plot.typeshade.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Build library and shader programs
        run: npm ci && npm run build && npm run examples
      - name: Build website
        run: npm ci --prefix website && npm run build --prefix website
      - name: Deploy website assets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret; the site is not deployed."
            exit 0
          fi
          npx wrangler deploy
